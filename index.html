<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Fade: a soroban on your real desk. Slide its beads with your fingertip." />
    <link rel="icon" href="data:," />
    <title>Fade</title>
    <style>
      html, body { margin: 0; height: 100%; background: #17110c; color: #f4ead8;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #scene-container { position: fixed; inset: 0; }
      #intro { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
        width: min(420px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px 22px;
        background: rgba(23, 17, 12, 0.82); border: 1px solid rgba(244, 234, 216, 0.18);
        border-radius: 16px; text-align: center; backdrop-filter: blur(6px); }
      #intro[hidden] { display: none; }
      h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 0.04em; font-weight: 650; }
      p { margin: 0 0 14px; line-height: 1.4; color: #dccfb8; }
      button { font: inherit; font-size: 18px; font-weight: 600; padding: 12px 34px;
        border-radius: 999px; border: 0; background: #c78c52; color: #1d130c; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      #note { margin: 12px 0 0; font-size: 14px; color: #b7a990; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="intro">
      <h1>Fade</h1>
      <p>A soroban on your desk. Slide the beads with your fingertip.</p>
      <button id="enter" type="button" disabled>Enter</button>
      <p id="note">Checking for a headset…</p>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
